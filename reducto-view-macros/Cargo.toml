[package]
name = "reducto-view-macros"
version = "0.1.0"
edition = "2021"
description = "Proc-macro for reducto view composition"
license = "MIT"
repository = "https://github.com/jvanderberg/reducto"
rust-version = "1.81"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
